<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>公民概念速查｜筱葳學測公民</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
  /* Layout: single reading column, PART sections in sequence, English passages set apart as "answer sheet" panels */
  :root{
    --bg:#F6F3EE;
    --surface:#FFFFFF;
    --surface-2:#EFE8DF;
    --ink:#2A2420;
    --ink-muted:#6B5F55;
    --line:#DDD1C3;
    --accent:#A2581C;
    --accent-ink:#FFFFFF;
    --accent-soft:#F5E4D3;
    --amber:#2B6A99;  --amber-ink:#FFFFFF;
    --teal:#4E9C8C;   --teal-ink:#0B241F;
    --bad:#B5483B;    --bad-soft:#F6E1DD;
    --hl-ts:#F3DFCB;  --hl-sup:#E1EAF3;  --hl-ex:#F7E3C6;  --hl-cs:#E9DDF2;
    --grid-line:rgba(162,88,28,0.07);
    --shadow:0 1px 2px rgba(28,42,36,0.06), 0 8px 24px rgba(28,42,36,0.05);
    --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
    --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    --f-en:'Source Serif 4','Georgia','Times New Roman',serif;
    --f-mono:'JetBrains Mono','Cascadia Code',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17120E; --surface:#211A15; --surface-2:#2A221B; --ink:#F0E9E2; --ink-muted:#B3A598;
      --line:#3E3329; --accent:#E9A86A; --accent-ink:#1E1206; --accent-soft:#3A2716;
      --amber:#86BCE6; --amber-ink:#0B1521; --teal:#3E8776; --teal-ink:#E7F5F1;
      --bad:#E48A7D; --bad-soft:#3A201C;
      --hl-ts:#4A3119; --hl-sup:#22334A; --hl-ex:#4A3519; --hl-cs:#3A2A48;
      --grid-line:rgba(233,168,106,0.07);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17120E; --surface:#211A15; --surface-2:#2A221B; --ink:#F0E9E2; --ink-muted:#B3A598;
    --line:#3E3329; --accent:#E9A86A; --accent-ink:#1E1206; --accent-soft:#3A2716;
    --amber:#86BCE6; --amber-ink:#0B1521; --teal:#3E8776; --teal-ink:#E7F5F1;
    --bad:#E48A7D; --bad-soft:#3A201C;
    --hl-ts:#4A3119; --hl-sup:#22334A; --hl-ex:#4A3519; --hl-cs:#3A2A48;
    --grid-line:rgba(233,168,106,0.07);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 32px),
      var(--bg);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:17px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; transition:none !important; } }
  h1,h2,h3{ font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0; color:var(--ink); }
  a{ color:var(--accent); }
  p{ margin:0; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }

  .page{ max-width:780px; margin:0 auto; padding-inline:1.25rem; padding-block:0 5rem; }

  .back{ display:inline-block; margin-top:1.6rem; font-size:0.85rem; color:var(--ink-muted); text-decoration:none; }
  .back:hover{ color:var(--accent); }

  .hero{ padding-block:2rem 1.6rem; display:grid; gap:0.9rem; }
  .eyebrow{
    justify-self:start;
    font-family:var(--f-mono); font-size:0.78rem; letter-spacing:0.06em;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--line);
    padding:0.3rem 0.7rem; border-radius:4px;
  }
  .hero h1{ font-size:clamp(1.9rem,5vw,2.5rem); line-height:1.25; }
  .hero .sub{ color:var(--ink-muted); font-size:1.03rem; max-width:640px; }

  .lede{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:1.1rem 1.3rem; box-shadow:var(--shadow); display:grid; gap:0.9rem;
  }
  .toc{ display:flex; flex-wrap:wrap; gap:0.5rem; padding:0; margin:0; list-style:none; }
  .toc a{
    display:inline-flex; gap:0.45rem; align-items:center; text-decoration:none;
    font-size:0.88rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    padding:0.25rem 0.75rem; border-radius:999px;
  }
  .toc a:hover{ border-color:var(--accent); color:var(--accent); }
  .toc b{ font-family:var(--f-mono); color:var(--accent); font-weight:700; }

  section.part{ margin-top:3.2rem; display:grid; gap:1.1rem; }
  .part-kicker{ font-family:var(--f-mono); font-size:0.78rem; letter-spacing:0.08em; color:var(--accent); }
  .part h2{ font-size:1.55rem; line-height:1.35; }
  .part h3{ font-size:1.08rem; margin-top:0.4rem; }

  .step{ display:grid; gap:0.5rem; }
  .step-tag{
    justify-self:start; font-family:var(--f-mono); font-size:0.72rem; font-weight:700;
    padding:0.1rem 0.55rem; border-radius:4px; background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--line);
  }
  .step-tag.rule{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .prompt{
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--amber);
    border-radius:6px; padding:0.9rem 1.1rem; font-size:0.95rem;
  }
  .prompt .label{ font-family:var(--f-mono); font-size:0.72rem; color:var(--amber); font-weight:700; letter-spacing:0.05em; display:block; margin-bottom:0.2rem; }

  .sheet{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:1rem 1.2rem; box-shadow:var(--shadow);
    font-family:var(--f-en); font-size:1.06rem; line-height:1.85;
  }
  .sheet p + p{ margin-top:0.8rem; }
  .sheet-head{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:0.3rem 1rem;
    font-family:var(--f-mono); font-size:0.75rem; color:var(--ink-muted); margin-bottom:0.5rem;
  }
  .sheet.weak{ border-color:var(--bad); }
  .sheet .err{ text-decoration:underline wavy var(--bad); text-underline-offset:4px; }

  .compare{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:0.9rem; }
  .compare > *{ min-width:0; }

  .note{
    background:var(--accent-soft); border:1px solid var(--line); border-radius:8px;
    padding:0.8rem 1rem; font-size:0.93rem;
  }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  table{ border-collapse:collapse; width:100%; font-size:0.92rem; min-width:520px; }
  th,td{ text-align:left; padding:0.6rem 0.85rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ background:var(--surface-2); font-weight:700; font-size:0.85rem; }
  tr:last-child td{ border-bottom:none; }
  td.en{ font-family:var(--f-en); font-size:1rem; }

  /* score band bar, drawn to scale 0–20 */
  .bands{ display:grid; gap:0.4rem; }
  .band-bar{ display:flex; gap:2px; border-radius:6px; overflow:hidden; height:40px; }
  .band-bar div{ display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; font-size:0.78rem; font-weight:700; }
  .band-bar small{ font-family:var(--f-mono); font-weight:400; font-size:0.68rem; }
  .b0{ background:var(--bad-soft); color:var(--bad); }
  .b1{ background:var(--surface-2); color:var(--ink-muted); }
  .b2{ background:var(--hl-sup); color:var(--ink); }
  .b3{ background:var(--hl-ts); color:var(--ink); }
  .b4{ background:var(--accent); color:var(--accent-ink); }
  .band-scale{ display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:0.7rem; color:var(--ink-muted); }

  /* paragraph anatomy */
  .anatomy-ctrl{ display:flex; flex-wrap:wrap; gap:0.5rem 1rem; align-items:center; }
  button.toggle{
    font:inherit; font-size:0.88rem; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px; padding:0.4rem 0.9rem;
  }
  button.toggle[aria-pressed="false"]{ background:var(--surface); color:var(--accent); border:1px solid var(--accent); }
  .key{ display:flex; flex-wrap:wrap; gap:0.3rem 0.9rem; font-size:0.82rem; color:var(--ink-muted); }
  .key span{ display:inline-flex; align-items:center; gap:0.35rem; }
  .key i{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .anatomy.on .ts{ background:var(--hl-ts); }
  .anatomy.on .sup{ background:var(--hl-sup); }
  .anatomy.on .ex{ background:var(--hl-ex); }
  .anatomy.on .cs{ background:var(--hl-cs); }
  .anatomy .ts,.anatomy .sup,.anatomy .ex,.anatomy .cs{ border-radius:3px; padding:0 2px; transition:background .2s ease; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .anatomy .tr{ font-weight:600; }
  .anatomy.on .tr{ color:var(--accent); }

  .skeleton{ display:grid; gap:0.4rem; counter-reset:sk; }
  .skeleton div{
    display:grid; grid-template-columns:7.5rem 1fr; gap:0.8rem; align-items:baseline;
    padding:0.55rem 0.9rem; border-radius:6px; font-size:0.92rem;
  }
  .skeleton div > *{ min-width:0; }
  .skeleton b{ font-size:0.86rem; }
  @media (max-width:480px){ .skeleton div{ grid-template-columns:1fr; gap:0.1rem; } }

  ul.clean{ margin:0; padding-left:1.2rem; display:grid; gap:0.3rem; }

  .timeline{ display:flex; gap:2px; border-radius:6px; overflow:hidden; height:46px; }
  .timeline div{ display:flex; flex-direction:column; justify-content:center; align-items:center; font-size:0.78rem; font-weight:700; line-height:1.15; text-align:center; padding:0 0.2rem; }
  .timeline small{ font-family:var(--f-mono); font-weight:400; font-size:0.68rem; }

  .checklist{ display:grid; gap:0.35rem; }
  .checklist label{ display:flex; gap:0.6rem; align-items:flex-start; font-size:0.93rem; cursor:pointer; }
  .checklist input{ margin-top:0.45rem; accent-color:var(--accent); }

  /* practice */
  .practice{ margin-top:3.2rem; display:grid; gap:1rem; }
  .qcard{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1rem 1.2rem; display:grid; gap:0.6rem; }
  .qhead{ display:flex; gap:0.6rem; align-items:baseline; }
  .qnum{ font-family:var(--f-mono); font-weight:700; color:var(--accent); flex:none; }
  .qcard .en{ font-family:var(--f-en); font-size:1.02rem; }
  .opts{ margin:0; padding-left:1.4rem; font-family:var(--f-en); font-size:1rem; display:grid; gap:0.15rem; }
  details{ border-top:1px dashed var(--line); padding-top:0.5rem; }
  summary{ cursor:pointer; color:var(--accent); font-size:0.88rem; font-weight:500; }
  details .ans{ margin-top:0.5rem; font-size:0.93rem; }

  /* draft box */
  .draft{ display:grid; gap:0.6rem; }
  textarea{
    width:100%; min-height:260px; resize:vertical;
    font-family:var(--f-en); font-size:1.02rem; line-height:1.75;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:0.9rem 1rem;
  }
  textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .meters{ display:flex; flex-wrap:wrap; gap:0.5rem; }
  .meter{ font-family:var(--f-mono); font-size:0.8rem; padding:0.25rem 0.7rem; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-muted); }
  .meter.ok{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .meter.warn{ background:var(--amber); color:var(--amber-ink); border-color:var(--amber); }

  footer{ margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--ink-muted); font-size:0.85rem; display:grid; gap:0.4rem; }
  footer .id{ font-family:var(--f-mono); font-size:0.8rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; margin-top:0.6rem; }
</style>
<style>
  .wt td.zh{ transition:filter .2s ease, opacity .2s ease; }
  .masked td.zh{ filter:blur(6px); opacity:.55; user-select:none; }
  .masked td.zh:hover,.masked td.zh:focus{ filter:none; opacity:1; }
  .tools{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; font-size:0.85rem; color:var(--ink-muted); }
  .pair{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.8rem; }
  .pair > *{ min-width:0; }
  .ex-line{ font-family:var(--f-en); font-size:1.02rem; }
  .ex-line + .ex-line{ margin-top:0.3rem; }
  .ok{ color:var(--accent); font-weight:600; }
  .no{ color:var(--bad); text-decoration:line-through; text-decoration-thickness:1px; }
  .hl{ background:var(--hl-ex); border-radius:3px; padding:0 2px; }
  .hl2{ background:var(--hl-ts); border-radius:3px; padding:0 2px; }
  .hl3{ background:var(--hl-sup); border-radius:3px; padding:0 2px; }
  .formula{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.8rem 1.1rem; font-family:var(--f-mono); font-size:0.9rem; line-height:1.9; overflow-x:auto; }
</style>
<style>
  .opt-list{ display:grid; gap:0.4rem; }
  .opt-btn{
    display:block; width:100%; text-align:left; cursor:pointer;
    font-family:var(--f-en); font-size:1rem; line-height:1.5; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:0.45rem 0.8rem;
  }
  .opt-btn:hover{ border-color:var(--accent); }
  .opt-btn.right{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .opt-btn.wrong{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad); }
  .opt-btn:disabled{ cursor:default; }
  .scorebar{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; font-size:0.9rem; color:var(--ink-muted); }
  .scorebar .meter{ font-size:0.85rem; }
  .passage{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1rem 1.2rem; font-family:var(--f-en); font-size:1.04rem; line-height:1.9; box-shadow:var(--shadow); }
  .passage p + p{ margin-top:0.7rem; }
  .blank{ font-family:var(--f-mono); font-size:0.85rem; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:0 0.35rem; }
  .optgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0.4rem; font-family:var(--f-en); }
  .optgrid span{ background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.6rem; }
  .fill{ width:100%; font:inherit; font-family:var(--f-en); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:0.4rem 0.6rem; }
  .fill:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .panels{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:0.6rem; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.7rem 0.8rem; font-size:0.9rem; }
  .panel b{ font-family:var(--f-mono); color:var(--accent); display:block; font-size:0.78rem; }
  .log-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0.6rem; align-items:end; }
  .log-form label{ display:grid; gap:0.2rem; font-size:0.82rem; color:var(--ink-muted); }
  select.fill{ appearance:auto; }
</style>
<style>
  .chk-row{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  textarea.ans-in{ min-height:0; resize:vertical; font-size:1rem; line-height:1.6; padding:0.5rem 0.7rem; }
  .verdict{ font-size:0.9rem; display:grid; gap:0.35rem; }
  .verdict:empty{ display:none; }
  .vd{ display:inline-block; font-weight:700; font-size:0.85rem; padding:0.1rem 0.6rem; border-radius:999px; }
  .vd.good{ background:var(--accent); color:var(--accent-ink); }
  .vd.bad{ background:var(--bad-soft); color:var(--bad); }
  .vd.warn{ background:var(--surface-2); color:var(--ink-muted); }
  .dx{ display:grid; gap:0.25rem; font-family:var(--f-en); font-size:1rem; background:var(--surface-2); border-radius:6px; padding:0.5rem 0.75rem; }
  .dx b{ font-family:var(--f-body); font-size:0.75rem; color:var(--ink-muted); display:inline-block; min-width:4.5rem; }
  .dx-bad{ color:var(--bad); text-decoration:underline wavy var(--bad); text-underline-offset:3px; }
  .dx-good{ color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .dx-note{ font-size:0.8rem; color:var(--ink-muted); }
  td .verdict{ margin-top:0.3rem; }
</style>
<style>
  /* history additions: vertical chronology, primary-source boxes */
  .chron{ list-style:none; margin:0.8rem 0 0; padding:0 0 0 0.2rem; display:grid; gap:0; }
  .chron li{ display:grid; grid-template-columns:5.6rem 1fr; gap:0.9rem; position:relative; padding:0.35rem 0 0.55rem; }
  .chron li > *{ min-width:0; }
  .chron li::before{ content:''; position:absolute; left:6.05rem; top:0; bottom:0; width:2px; background:var(--line); }
  .chron li::after{ content:''; position:absolute; left:calc(6.05rem - 4px); top:0.85rem; width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); }
  .chron li.turn::after{ background:var(--accent); }
  .chron .yr{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:0.82rem; font-weight:700; color:var(--accent); text-align:right; padding-top:0.15rem; }
  .chron .ev{ padding-left:0.9rem; font-size:0.95rem; line-height:1.65; }
  .chron .ev small{ display:block; color:var(--ink-muted); font-size:0.82rem; }
  @media (max-width:480px){
    .chron li{ grid-template-columns:4.4rem 1fr; gap:0.6rem; }
    .chron li::before{ left:4.75rem; } .chron li::after{ left:calc(4.75rem - 4px); }
  }
  .src{ background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:6px; padding:0.7rem 1rem; font-family:var(--f-display); font-size:1rem; line-height:1.85; margin:0; }
  .src cite{ display:block; font-style:normal; font-family:var(--f-body); font-size:0.78rem; color:var(--ink-muted); margin-top:0.3rem; }
  .qcard .qtext{ margin:0; }
  textarea.fill{ font-family:var(--f-body); }
  .kwtag{ font-family:var(--f-mono); font-size:0.75rem; background:var(--accent-soft); color:var(--accent); border:1px solid var(--line); border-radius:4px; padding:0.05rem 0.4rem; white-space:nowrap; }
</style>

<style>
  /* geography additions */
  .chain .yr{ font-family:var(--f-body); font-size:0.8rem; }
  .fig{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.8rem 1rem; box-shadow:var(--shadow); display:grid; gap:0.4rem; }
  .fig svg{ width:100%; height:auto; display:block; }
  .fig figcaption{ font-size:0.82rem; color:var(--ink-muted); }
  .fig text{ font-family:var(--f-body); }
  .twocol{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.8rem; }
  .twocol > *{ min-width:0; }
  .card-mini{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.7rem 0.9rem; font-size:0.92rem; }
  .card-mini b{ display:block; font-family:var(--f-display); font-size:1rem; margin-bottom:0.2rem; }
</style>
<style>
  /* civics additions */
  .chain{ list-style:none; margin:0; padding:0; display:grid; gap:0.4rem; }
  .chain li{ display:grid; grid-template-columns:auto 1fr; gap:0.7rem; align-items:baseline; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:0.5rem 0.85rem; font-size:0.93rem; }
  .chain li > *{ min-width:0; }
  .chain li b{ font-family:var(--f-mono); font-size:0.75rem; color:var(--accent); white-space:nowrap; }
  .chain li.arrow{ background:none; border:none; padding:0 0 0 1.2rem; color:var(--ink-muted); font-size:0.85rem; }
  .vs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:0.8rem; }
  .vs > *{ min-width:0; }
  .case{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:6px; padding:0.8rem 1.1rem; font-size:0.95rem; display:grid; gap:0.35rem; }
  .case .label{ font-family:var(--f-mono); font-size:0.72rem; color:var(--amber); font-weight:700; letter-spacing:0.05em; }
  .opt-btn{ font-family:var(--f-body); }
  .bridge{ display:grid; gap:0.45rem; border-top:1px dashed var(--line); padding-top:0.8rem; font-size:0.9rem; }
  .bridge .where{ display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; }
  .bridge .tag{ font-family:var(--f-mono); font-size:0.72rem; font-weight:700; padding:0.1rem 0.55rem; border-radius:4px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--line); }
  .bridge .tag.th{ background:var(--surface-2); color:var(--ink-muted); }
  .bridge .step{ display:grid; grid-template-columns:3.2rem 1fr; gap:0.6rem; align-items:baseline; }
  .bridge .step > *{ min-width:0; }
  .bridge .step b{ font-family:var(--f-mono); font-size:0.75rem; color:var(--ink-muted); }
  .bridge .step.now b{ color:var(--accent); }
  .bridge a{ text-decoration:none; font-weight:500; }
  .bridge a:hover{ text-decoration:underline; }
  .xl{ display:grid; gap:0.5rem; }
  .xl a{ display:grid; grid-template-columns:minmax(6.5rem,auto) 1fr; gap:0.3rem 0.9rem; align-items:baseline; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.6rem 0.9rem; font-size:0.92rem; }
  .xl a > *{ min-width:0; }
  .xl a:hover{ border-color:var(--accent); }
  .xl a b{ font-family:var(--f-display); color:var(--accent); }
  .xl a small{ display:block; color:var(--ink-muted); font-size:0.8rem; }
  @media (max-width:480px){ .xl a{ grid-template-columns:1fr; } }
</style>
<style>
  .ggrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:0.6rem; }
  .gcard{ font:inherit; text-align:left; cursor:pointer; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0.7rem 0.9rem; display:grid; gap:0.25rem; box-shadow:var(--shadow); }
  .gcard:hover{ border-color:var(--accent); }
  .gterm{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--accent); }
  .gdef{ font-size:0.9rem; line-height:1.6; transition:filter .2s ease, opacity .2s ease; }
  .gdef small{ display:block; color:var(--ink-muted); font-size:0.78rem; margin-top:0.2rem; }
  .quiz .gdef{ filter:blur(6px); opacity:.5; user-select:none; }
  .quiz .gcard.open .gdef{ filter:none; opacity:1; }
  .quiz .gcard.open{ border-color:var(--accent); }
</style></head>
<body>
<div class="page">
<a class="back" href="index.html">← 回到公民學習地圖</a>
<header class="hero">
  <span class="eyebrow">概念速查</span>
  <h1>公民概念速查</h1>
  <p class="sub">隨時查、考前每天看。共 62 個高頻概念，每個附上最容易搞混的對手。打開「自我測驗」會遮住解釋，先自己說一次，再點卡片對答案。</p>
</header>
<div class="lede"><div class="tools"><button class="toggle" type="button" id="qz" aria-pressed="false">自我測驗：遮住解釋</button><span id="qzc"></span></div></div>
<div id="gwrap"><section class="part"><span class="part-kicker">公民與社會・16 個</span><div class="ggrid"><button class="gcard" type="button"><span class="gterm">人性尊嚴</span><span class="gdef">人本身就是目的，不能只被當成工具。人權的核心。<small>易混：人權</small></span></button><button class="gcard" type="button"><span class="gterm">第一代人權</span><span class="gdef">公民與政治權，要求國家不干預：人身、言論、宗教自由。<small>易混：第二代</small></span></button><button class="gcard" type="button"><span class="gterm">第二代人權</span><span class="gdef">經濟社會文化權，要求國家積極給付：工作、教育、社會保障。<small>易混：第一代</small></span></button><button class="gcard" type="button"><span class="gterm">第三代人權</span><span class="gdef">集體（連帶）權，需國際合作：發展權、環境權、民族自決。</span></button><button class="gcard" type="button"><span class="gterm">兩公約施行法</span><span class="gdef">2009 年制定，使兩公約在我國具國內法效力。<small>易混：加入聯合國</small></span></button><button class="gcard" type="button"><span class="gterm">社會化</span><span class="gdef">學習社會價值、規範與角色的過程，持續一生；家庭最早最深。</span></button><button class="gcard" type="button"><span class="gterm">再社會化</span><span class="gdef">進入全新環境時，放下舊規範、學習新規範（入伍、移民）。<small>易混：社會流動</small></span></button><button class="gcard" type="button"><span class="gterm">初級團體</span><span class="gdef">關係親密、面對面、以情感為主，例如家庭、好友。<small>易混：次級團體</small></span></button><button class="gcard" type="button"><span class="gterm">科層制</span><span class="gdef">分工、層級節制、依規則、非人情化；缺點是僵化。</span></button><button class="gcard" type="button"><span class="gterm">刻板印象</span><span class="gdef">對某群體簡化、概括的印象。<small>易混：偏見、歧視</small></span></button><button class="gcard" type="button"><span class="gterm">歧視</span><span class="gdef">把偏見化為行為，造成差別待遇。<small>易混：偏見是態度</small></span></button><button class="gcard" type="button"><span class="gterm">實質平等</span><span class="gdef">考慮起點差異，給弱勢合理差別待遇。<small>易混：形式平等</small></span></button><button class="gcard" type="button"><span class="gterm">差異原則</span><span class="gdef">羅爾斯：不平等必須對最不利者最有利。<small>易混：效益主義</small></span></button><button class="gcard" type="button"><span class="gterm">社會保險</span><span class="gdef">強制納保、繳費、風險分擔：健保、勞保、國民年金。<small>易混：社會救助</small></span></button><button class="gcard" type="button"><span class="gterm">社會救助</span><span class="gdef">不需繳費，經資產調查：低收入戶生活扶助。<small>易混：社會保險</small></span></button><button class="gcard" type="button"><span class="gterm">代間流動</span><span class="gdef">比較子女與父母的階層位置。<small>易混：代內流動</small></span></button></div></section><section class="part"><span class="part-kicker">民主政治・15 個</span><div class="ggrid"><button class="gcard" type="button"><span class="gterm">主權</span><span class="gdef">對內最高、對外獨立。國家四要素之一。</span></button><button class="gcard" type="button"><span class="gterm">內閣制</span><span class="gdef">行政立法融合，內閣對國會負責；可倒閣、可解散國會。<small>易混：總統制</small></span></button><button class="gcard" type="button"><span class="gterm">總統制</span><span class="gdef">嚴格分立，總統不對國會負責；有否決權、彈劾，無倒閣。<small>易混：內閣制</small></span></button><button class="gcard" type="button"><span class="gterm">半總統制</span><span class="gdef">總統直選有實權，總理對國會負責；可能共治。</span></button><button class="gcard" type="button"><span class="gterm">覆議</span><span class="gdef">行政院經總統核可移請立法院覆議；全體立委 1/2 以上維持原決議，院長應接受。<small>易混：不信任案</small></span></button><button class="gcard" type="button"><span class="gterm">不信任案</span><span class="gdef">1/3 立委連署、全體 1/2 通過；院長 10 日內辭職並得呈請解散立法院。<small>易混：覆議</small></span></button><button class="gcard" type="button"><span class="gterm">並立制</span><span class="gdef">區域票與政黨票分開計算後相加；我國立委選制。<small>易混：聯立制</small></span></button><button class="gcard" type="button"><span class="gterm">杜瓦傑法則</span><span class="gdef">單一選區相對多數制傾向形成兩黨制。</span></button><button class="gcard" type="button"><span class="gterm">利益團體</span><span class="gdef">目標是影響政策，通常不推候選人。<small>易混：政黨要取得政權</small></span></button><button class="gcard" type="button"><span class="gterm">罷免通過</span><span class="gdef">同意票多於不同意票，且同意票達選舉人總數 1/4。<small>易混：公投門檻相似</small></span></button><button class="gcard" type="button"><span class="gterm">審議民主</span><span class="gdef">強調資訊充分、理性討論；公民會議、參與式預算。<small>易混：直接民主</small></span></button><button class="gcard" type="button"><span class="gterm">均權原則</span><span class="gdef">依事務性質分配中央與地方權限。</span></button><button class="gcard" type="button"><span class="gterm">自治條例</span><span class="gdef">經地方議會通過，可訂罰鍰，不能訂刑罰。<small>易混：自治規則</small></span></button><button class="gcard" type="button"><span class="gterm">議題設定</span><span class="gdef">媒體報導頻率影響民眾認為什麼議題重要。<small>易混：框架效應</small></span></button><button class="gcard" type="button"><span class="gterm">抽樣誤差</span><span class="gdef">民調結果的可能誤差範圍；差距在誤差內不能斷定領先。</span></button></div></section><section class="part"><span class="part-kicker">法律與生活・15 個</span><div class="ggrid"><button class="gcard" type="button"><span class="gterm">法律保留</span><span class="gdef">限制人民權利的重要事項，要由法律規定。<small>易混：法律優位</small></span></button><button class="gcard" type="button"><span class="gterm">比例原則</span><span class="gdef">適當性 → 必要性（最小侵害）→ 衡量性（損益相當）。</span></button><button class="gcard" type="button"><span class="gterm">憲法第 22 條</span><span class="gdef">概括條款：保障未列舉的權利，例如隱私權。</span></button><button class="gcard" type="button"><span class="gterm">行政處分</span><span class="gdef">行政機關就具體個案單方作成、對外直接發生效果的決定。<small>易混：行政命令</small></span></button><button class="gcard" type="button"><span class="gterm">訴願</span><span class="gdef">不服行政處分，30 日內經原處分機關向上級機關提起。<small>易混：行政訴訟</small></span></button><button class="gcard" type="button"><span class="gterm">國家賠償</span><span class="gdef">公務員違法侵權，或公共設施設置管理欠缺致損。</span></button><button class="gcard" type="button"><span class="gterm">限制行為能力</span><span class="gdef">7 歲以上未滿 18 歲；法律行為原則需法定代理人允許。<small>易混：無行為能力</small></span></button><button class="gcard" type="button"><span class="gterm">純獲法律上利益</span><span class="gdef">限制行為能力人可單獨為之，例如受贈。</span></button><button class="gcard" type="button"><span class="gterm">效力未定</span><span class="gdef">限制行為能力人未經允許的契約，待法定代理人承認。<small>易混：無效</small></span></button><button class="gcard" type="button"><span class="gterm">侵權行為</span><span class="gdef">故意或過失不法侵害他人權利，負損害賠償責任。</span></button><button class="gcard" type="button"><span class="gterm">限定繼承</span><span class="gdef">繼承人以所得遺產為限清償債務。<small>易混：拋棄繼承</small></span></button><button class="gcard" type="button"><span class="gterm">罪刑法定</span><span class="gdef">行為時法律明文規定才處罰。</span></button><button class="gcard" type="button"><span class="gterm">正當防衛</span><span class="gdef">阻卻違法事由之一。<small>易混：緊急避難</small></span></button><button class="gcard" type="button"><span class="gterm">罪疑唯輕</span><span class="gdef">證據不足時作有利被告的認定。<small>易混：無罪推定</small></span></button><button class="gcard" type="button"><span class="gterm">國民法官</span><span class="gdef">重大刑案由 6 位國民法官與 3 位法官共同審判。</span></button></div></section><section class="part"><span class="part-kicker">經濟與生活・16 個</span><div class="ggrid"><button class="gcard" type="button"><span class="gterm">機會成本</span><span class="gdef">外顯成本＋放棄選擇中價值最高者。<small>易混：沉沒成本</small></span></button><button class="gcard" type="button"><span class="gterm">沉沒成本</span><span class="gdef">已付出、無法收回的成本，不應影響決策。<small>易混：機會成本</small></span></button><button class="gcard" type="button"><span class="gterm">需求變動</span><span class="gdef">價格以外因素改變，整條需求線移動。<small>易混：需求量變動</small></span></button><button class="gcard" type="button"><span class="gterm">替代品</span><span class="gdef">可互相取代；A 漲價 → B 需求增加。<small>易混：互補品</small></span></button><button class="gcard" type="button"><span class="gterm">互補品</span><span class="gdef">一起使用；A 漲價 → B 需求減少。<small>易混：替代品</small></span></button><button class="gcard" type="button"><span class="gterm">價格上限</span><span class="gdef">設在均衡以下，造成短缺。<small>易混：價格下限 → 過剩</small></span></button><button class="gcard" type="button"><span class="gterm">負外部性</span><span class="gdef">第三人承擔成本、未反映在價格；生產過多。<small>易混：正外部性</small></span></button><button class="gcard" type="button"><span class="gterm">公共財</span><span class="gdef">無敵對性、無排他性；搭便車 → 市場供給不足。<small>易混：共有資源</small></span></button><button class="gcard" type="button"><span class="gterm">共有資源</span><span class="gdef">有敵對性、無排他性；公地悲劇。<small>易混：公共財</small></span></button><button class="gcard" type="button"><span class="gterm">逆選擇</span><span class="gdef">交易前資訊不對稱，劣質品驅逐良品（二手車）。<small>易混：道德風險</small></span></button><button class="gcard" type="button"><span class="gterm">道德風險</span><span class="gdef">交易後行為改變增加風險（投保後變不小心）。<small>易混：逆選擇</small></span></button><button class="gcard" type="button"><span class="gterm">比較利益</span><span class="gdef">機會成本較低者專業生產。<small>易混：絕對利益</small></span></button><button class="gcard" type="button"><span class="gterm">新台幣升值</span><span class="gdef">利進口、出國；不利出口與外幣存款。<small>易混：貶值</small></span></button><button class="gcard" type="button"><span class="gterm">GDP</span><span class="gdef">一定期間、國內、最終財貨勞務的市場價值。<small>易混：GNI</small></span></button><button class="gcard" type="button"><span class="gterm">吉尼係數</span><span class="gdef">0 到 1，愈大所得分配愈不平均。</span></button><button class="gcard" type="button"><span class="gterm">累進稅</span><span class="gdef">所得愈高稅率愈高，具重分配效果。<small>易混：比例稅</small></span></button></div></section></div>
<footer>
  <p>練習題的情境與數據為教學用自編或示意；內容依部定必修「公民與社會」課程整理，法規以現行條文為準，若有修法請以最新規定為準。正式考試範圍以大考中心公告為準。</p>
  <div class="id"><span>筱葳學測公民</span><span>概念速查</span></div>
</footer>
</div>
<script>
(function(){
  var w=document.getElementById('gwrap'), b=document.getElementById('qz'), c=document.getElementById('qzc');
  var cards=[].slice.call(document.querySelectorAll('.gcard'));
  function cnt(){ if(!w.classList.contains('quiz')){ c.textContent=''; return; } var o=cards.filter(function(x){return x.classList.contains('open');}).length; c.textContent='已翻開 '+o+' / '+cards.length; }
  b.addEventListener('click',function(){
    var on=!w.classList.contains('quiz'); w.classList.toggle('quiz',on); b.setAttribute('aria-pressed',on?'false':'true');
    b.textContent=on?'結束測驗：顯示全部':'自我測驗：遮住解釋'; cards.forEach(function(x){x.classList.remove('open');}); cnt();
  });
  cards.forEach(function(x){ x.addEventListener('click',function(){ if(w.classList.contains('quiz')){ x.classList.toggle('open'); cnt(); } }); });
})();
</script>
</body>
